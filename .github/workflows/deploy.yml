name: Deploy to Azure Functions

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Functions
        uses: azure/functions-action@v1
        with:
          app-name: func-elg-sftp-user-mgr
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE_104BBD2654F14DE9AB56603600C6D04E }}
          scm-do-build-during-deployment: true
